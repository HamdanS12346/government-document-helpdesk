services:
  backend:
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/app/app:ro
      - ./guardrails:/app/guardrails:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - INTERNAL_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
